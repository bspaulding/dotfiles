# In Bed by 7pm - tmux theme

# Ported from Sarah Drasner’s VS Code theme (sdras/inbedby7pm)

#

# Installation:

# Place this file at ~/.config/tmux/inbedby7pm.conf

# Then add to your ~/.tmux.conf:

# source-file ~/.config/tmux/inbedby7pm.conf

# Palette:

# bg        #1e1e3f  deep indigo

# bg_alt    #2d2b55  lighter indigo

# border    #4b4880  dim borders

# fg        #a599e9  soft lavender

# fg_dim    #7b6fc4  dimmer lavender

# purple    #c792ea  active highlight

# pink      #ff9ac1  special

# red       #ff628c  alerts

# Status bar

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#a599e9,bg=#2d2b55"

# Left: session name

set -g status-left-length 40
set -g status-left "#[fg=#1e1e3f,bg=#c792ea,bold] #S #[fg=#c792ea,bg=#2d2b55,nobold] "

# Right: time and host

set -g status-right-length 60
set -g status-right "#[fg=#7b6fc4,bg=#2d2b55] %H:%M  %d %b "

# Window list

set -g window-status-separator " "

# Inactive window

set -g window-status-format "#[fg=#7b6fc4,bg=#2d2b55] #I:#W#F "

# Active window

set -g window-status-current-format "#[fg=#1e1e3f,bg=#c792ea,bold] #I:#W#F "

# Window with activity

set -g window-status-activity-style "fg=#ff9ac1,bg=#2d2b55"

# Window with bell

set -g window-status-bell-style "fg=#ff628c,bg=#2d2b55,bold"

# Pane borders

set -g pane-border-style "fg=#4b4880"
set -g pane-active-border-style "fg=#c792ea"

# Message / command line

set -g message-style "fg=#c792ea,bg=#2d2b55,bold"

# Copy mode / selection highlight

set -g mode-style "fg=#1e1e3f,bg=#c792ea,bold"

# Clock

set -g clock-mode-colour "#c792ea"

# Pane number display

set -g display-panes-active-colour "#c792ea"
set -g display-panes-colour "#4b4880"
